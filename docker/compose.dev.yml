# Local development services. Start with `pnpm dev:services`.
name: freelo-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freelo
      POSTGRES_PASSWORD: freelo
      POSTGRES_DB: freelo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  # Catches every outgoing email. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible storage. Console: http://localhost:9001 (freelo / freelo-secret)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: freelo
      MINIO_ROOT_PASSWORD: freelo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the dev bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 freelo freelo-secret; do sleep 1; done;
      mc mb --ignore-existing local/freelo-dev;
      "

volumes:
  pgdata:
  miniodata:
